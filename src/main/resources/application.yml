spring:
  sql:
    init:
      mode: never

jpa:
  show-sql: true
  properties:
    hibernate:
      format_sql: true
  defer-datasource-initialization: true

datasource:
  url: jdbc:h2:mem:testdb

h2:
  console:
    enabled: true

gemini:
  api-key: ${AI_API_KEY}

resilience4j:
  retry:
    instances:
      geminiRetry:
        max-attempts: 3
        wait-duration: 2s
        retry-exceptions:
          - java.io.IOException
          - org.springframework.web.client.RestClientException

  circuitbreaker:
    instances:
      geminiCB:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s

  timelimiter:
    instances:
      geminiTimeout:
        timeout-duration: 5s